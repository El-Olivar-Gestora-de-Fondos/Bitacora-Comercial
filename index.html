<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Asesores</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --navy:#152541;
    --navy-2:#1f3a63;
    --paper:#F7F4EC;
    --paper-2:#EFEADB;
    --card:#FFFFFF;
    --gold:#B8863C;
    --gold-deep:#8C6529;
    --ink:#1B2333;
    --ink-soft:#5B6472;
    --line:#DEDACB;
    --green:#2F6E4E;
    --green-bg:#E4F0E7;
    --amber:#9A6B12;
    --amber-bg:#FBEDD4;
    --blue:#25507F;
    --blue-bg:#E4EDF6;
    --violet:#5B4C8C;
    --violet-bg:#EBE7F5;
    --teal:#1F7A6C;
    --teal-bg:#DCEFEA;
    --red:#A03A3A;
    --red-bg:#F7E1DE;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; padding:28px 18px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    height:48px;width:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0;
    color:var(--navy); letter-spacing:-0.01em;
  }
  .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  nav{display:flex;gap:6px;background:var(--paper-2);padding:4px;border-radius:10px;flex-wrap:wrap;overflow-x:auto;}
  nav button{
    border:none;background:transparent;padding:9px 16px;border-radius:7px;
    font-family:'Inter';font-size:13.5px;font-weight:500;color:var(--ink-soft);
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  nav button.active{background:var(--navy);color:#fff;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  .stat{
    background:var(--navy);color:#fff;border-radius:var(--radius);
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .stat.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;margin-top:2px;}
  .stat.alt .l{color:var(--ink-soft);opacity:1;}
  .filters{
    display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;
  }
  .filters select, .filters input[type=date], .filters input[type=month], .filters input[type=text]{
    font-family:'Inter';font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink);
  }
  .filters .today-btn{
    font-size:12.5px;color:var(--gold-deep);background:none;border:1px solid var(--gold);
    padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;
  }
  .day-group{margin-bottom:26px;}
  .day-group h2{
    font-family:'Fraunces',serif;font-weight:500;font-size:15px;color:var(--navy-2);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 12px;
  }
  .ticket{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    display:flex; margin-bottom:12px; overflow:hidden;
  }
  .t-time{
    width:96px; flex-shrink:0; background:var(--navy); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; padding:10px 6px; text-align:center;
  }
  .t-time .hh{font-size:19px;font-weight:500;}
  .t-time .dd{font-size:10px;opacity:.7;margin-top:3px;letter-spacing:.03em;text-transform:uppercase;}
  .t-body{flex:1;padding:14px 16px; position:relative;}
  .t-notch{
    width:16px;height:16px;border-radius:50%;background:var(--paper);
    position:absolute; left:-8px; top:50%; transform:translateY(-50%);
    border:1px solid var(--line);
  }
  .t-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;}
  .t-name{font-weight:600;font-size:15px;}
  .t-advisor{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .b-bono{background:var(--blue-bg);color:var(--blue);}
  .b-fondo{background:var(--violet-bg);color:var(--violet);}
  .st-agendada{background:var(--blue-bg);color:var(--blue);}
  .st-presentada{background:var(--violet-bg);color:var(--violet);}
  .st-gestion{background:var(--amber-bg);color:var(--amber);}
  .st-acres{background:var(--teal-bg);color:var(--teal);}
  .st-emitida{background:var(--green-bg);color:var(--green);}
  .st-perdida{background:var(--red-bg);color:var(--red);}
  .t-meta{
    display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--ink-soft);
    border-top:1px dashed var(--line); padding-top:9px;
  }
  .t-meta span{display:flex;align-items:center;gap:5px;}
  .t-meta a{color:var(--blue);text-decoration:none;font-weight:500;}
  .t-notes{
    margin-top:9px;font-size:12.5px;color:var(--ink);background:var(--paper);
    border-radius:7px;padding:8px 10px;line-height:1.4;
  }
  .t-notes-empty{color:var(--ink-soft);cursor:pointer;font-style:italic;background:transparent;
    border:1px dashed var(--line);}
  .note-edit{color:var(--gold-deep);cursor:pointer;font-weight:500;font-style:normal;margin-left:6px;}
  .t-actions{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap;}
  .btn{
    font-family:'Inter';font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:7px;
    cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
  }
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.danger{color:var(--red);border-color:var(--red);background:none;}
  .btn:hover{filter:brightness(0.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .evid-thumb{
    width:42px;height:42px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:pointer;
  }
  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:13.5px;
    border:1px dashed var(--line); border-radius:12px; background:var(--card);
  }
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:'Inter';font-size:14px;background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;font-family:'Inter';}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold);outline-offset:0;}
  .radio-row{display:flex;gap:10px;}
  .radio-opt{
    flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;
    display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;background:var(--paper);
  }
  .radio-opt.checked{border-color:var(--navy);background:var(--blue-bg);}
  .err{color:var(--red);font-size:12px;margin-top:4px;}
  .submit-row{display:flex;justify-content:flex-end;margin-top:6px;gap:8px;}
  .datalist-note{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(21,37,65,.55);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:20px;
  }
  .modal{background:var(--card);border-radius:14px;padding:20px;max-width:480px;width:100%;}
  .modal img{width:100%;border-radius:8px;margin-top:10px;}
  .modal h3{font-family:'Fraunces',serif;margin:0 0 4px;font-size:17px;color:var(--navy);}
  .modal textarea{width:100%;font-family:'JetBrains Mono',monospace;font-size:11.5px;height:220px;margin-top:10px;
    border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink);}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
  .reminders{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:18px;
  }
  .reminders h2{
    font-family:'Fraunces',serif;font-weight:500;font-size:14px;color:var(--navy-2);margin:0 0 10px;
  }
  .rem-empty{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .rem-item{
    display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 9px;
    border-radius:7px;background:var(--paper);margin-bottom:6px;flex-wrap:wrap;
  }
  .rem-item.rem-soon{background:var(--amber-bg);}
  .rem-item.rem-urgent{background:var(--red-bg);}
  .rem-time{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--navy);min-width:78px;}
  .rem-name{font-weight:500;flex:1;}
  .rem-adv{color:var(--ink-soft);}
  .gate-wrap{max-width:420px;margin:60px auto;text-align:center;}
  .gate-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:left;
  }
  .gate-mark{
    height:96px;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
  }
  .gate-mark img{height:100%;width:auto;object-fit:contain;}
  .gate-card h1{font-size:20px;margin-bottom:4px;}
  .gate-card .sub{margin-bottom:20px;}
  .role-row{display:flex;gap:10px;margin-bottom:16px;}
  .role-opt{
    flex:1;border:1px solid var(--line);border-radius:9px;padding:14px 10px;text-align:center;
    cursor:pointer;font-size:13.5px;font-weight:500;background:var(--paper);
  }
  .role-opt.checked{border-color:var(--navy);background:var(--blue-bg);color:var(--navy);}
  .id-badge{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);margin-top:4px;flex-wrap:wrap;
  }
  .id-badge b{color:var(--ink);}
  .id-badge a{color:var(--gold-deep);cursor:pointer;font-weight:500;text-decoration:none;}
  .role-tag{
    font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;
    background:var(--paper-2);color:var(--ink-soft);font-weight:600;
  }
  .banner{padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;border:1px solid var(--line);
    background:var(--amber-bg);color:var(--amber);}
  .banner.info{background:var(--blue-bg);color:var(--blue);}
  .banner.danger{background:var(--red-bg);color:var(--red);}
  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;}
  .kcol{flex:0 0 250px;width:250px;background:var(--paper-2);border-radius:12px;padding:10px;}
  .kcol-pinned{position:sticky;left:0;z-index:3;box-shadow:6px 0 10px -6px rgba(0,0,0,.25);}
  .kcol h3{font-family:'Fraunces',serif;font-size:12.5px;margin:0 0 8px;color:var(--navy-2);
    display:flex;justify-content:space-between;align-items:center;font-weight:600;}
  .kcol .count{background:var(--navy);color:#fff;font-size:11px;padding:1px 8px;border-radius:20px;font-family:'JetBrains Mono',monospace;}
  .kcol-body{display:flex;flex-direction:column;gap:8px;max-height:66vh;overflow-y:auto;padding-right:2px;}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;}
  .kcard-drag{cursor:grab;}
  .kcard-drag:active{cursor:grabbing;}
  .kcard.dragging{opacity:.4;}
  .kcol-body.drag-over{background:var(--blue-bg);outline:2px dashed var(--navy);outline-offset:-2px;border-radius:8px;}
  .kcard .kc-name{font-weight:600;font-size:13.5px;}
  .kcard .kc-meta{color:var(--ink-soft);font-size:11.5px;margin:3px 0 6px;}
  .kcard select{width:100%;font-size:12px;padding:6px 7px;border-radius:6px;border:1px solid var(--line);
    margin-bottom:6px;background:var(--paper);color:var(--ink);}
  .kcard .kc-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px;}
  .kcard .kc-actions .btn{font-size:11px;padding:4px 8px;}
  .kcard .t-notes{font-size:11.5px;padding:6px 8px;margin-top:6px;}
  .progress{background:var(--paper-2);border-radius:20px;height:8px;overflow:hidden;margin:6px 0;}
  .progress-bar{height:100%;background:var(--navy);border-radius:20px;}
  .progress-bar.warn{background:var(--amber);}
  .progress-bar.ok{background:var(--green);}
  .report-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .report-card h2{font-family:'Fraunces',serif;font-weight:500;font-size:15px;color:var(--navy-2);margin:0 0 12px;}
  .funnel-row{display:flex;gap:6px;align-items:stretch;overflow-x:auto;margin:6px 0 14px;}
  .funnel-step{flex:1;min-width:104px;background:var(--paper);border-radius:8px;padding:10px 10px;text-align:center;}
  .funnel-step .fn{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500;color:var(--navy);}
  .funnel-step .fl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
  .arrow{align-self:center;color:var(--ink-soft);font-size:15px;padding:0 2px;}
  .scroll-x{overflow-x:auto;}
  table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px;}
  table.cmp th, table.cmp td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  table.cmp th{color:var(--ink-soft);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  table.cmp input[type=number]{width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
  .import-preview{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px;}
  .import-preview table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .import-preview th,.import-preview td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;}
  .import-preview .row-err{background:var(--red-bg);}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--paper-2);color:var(--ink-soft);}
  .team-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .team-chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);
    border-radius:20px;padding:5px 8px 5px 12px;font-size:12.5px;}
  .team-chip button{border:none;background:none;color:var(--red);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;}
  .auth-toggle{display:flex;gap:6px;margin-bottom:18px;background:var(--paper-2);border-radius:9px;padding:4px;}
  .auth-toggle button{flex:1;border:none;background:none;padding:9px 6px;border-radius:7px;font-size:12.5px;
    font-weight:500;color:var(--ink-soft);cursor:pointer;}
  .auth-toggle button.active{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .view-toggle{display:flex;gap:4px;background:var(--paper-2);border-radius:9px;padding:3px;align-self:center;}
  .view-toggle button{border:none;background:none;padding:6px 13px;border-radius:6px;font-size:12px;
    font-weight:500;color:var(--ink-soft);cursor:pointer;}
  .view-toggle button.active{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .print-header{display:none;}
  @media print{
    @page{ size:landscape; margin:12mm; }
    #app-stats, header, .banner, .filters, .submit-row, .datalist-note,
    .note-edit, .t-notes-empty, .evid-thumb, .no-print, button{ display:none !important; }
    input, select{ border:none !important; background:transparent !important; -webkit-appearance:none; appearance:none;
      padding:0 !important; pointer-events:none; box-shadow:none !important; }
    body{ background:#fff !important; }
    .print-header{ display:block !important; margin-bottom:14px; border-bottom:2px solid #152541; padding-bottom:10px; }
    .report-card{ break-inside:avoid; page-break-inside:avoid; box-shadow:none !important; border:1px solid #ddd !important; }
    .kcard, .ticket{ break-inside:avoid; }
    .scroll-x{ overflow:visible !important; }
    table.cmp{ min-width:0 !important; width:100% !important; table-layout:fixed !important; font-size:8.5px !important; }
    table.cmp th, table.cmp td{ white-space:normal !important; word-break:break-word; padding:4px 3px !important; }
    table.cmp input[type=number]{ width:100% !important; }
  }
  .auth-security-note{font-size:10.5px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}
  .badge-pending{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--amber-bg);color:var(--amber);}
  .badge-activo{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--green-bg,var(--paper-2));color:var(--green);}
  .team-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
  .team-table th,.team-table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  .team-table th{color:var(--ink-soft);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  .team-table select{font-size:11.5px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  .team-table .btn{font-size:11px;padding:4px 8px;}
  .contact-line{font-size:11px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .contact-line a{color:var(--ink-soft);text-decoration:none;}
  .contact-line a:hover{text-decoration:underline;}
  .t-monto{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--green);font-size:12.5px;margin-top:4px;}
  .bars{display:flex;flex-direction:column;gap:7px;margin:14px 0;}
  .bar-row{display:grid;grid-template-columns:130px 1fr 92px;align-items:center;gap:10px;font-size:12px;}
  .bar-label{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{background:var(--paper-2);border-radius:20px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--navy);border-radius:20px;min-width:3px;}
  .notif-wrap{position:relative;align-self:flex-start;}
  .notif-bell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;line-height:1;}
  .notif-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;min-width:14px;text-align:center;}
  .notif-panel{position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);width:320px;max-height:420px;overflow-y:auto;z-index:80;padding:10px;}
  .notif-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;gap:8px;}
  .notif-panel-head a{cursor:pointer;font-size:11.5px;}
  .notif-item{padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--paper-2);border-radius:6px;}
  .notif-msg{color:var(--ink);}
  .notif-time{color:var(--ink-soft);font-size:10.5px;margin-top:2px;}
  .notif-section-title{font-weight:600;font-size:11.5px;margin:10px 0 4px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;}
  @media print{ .notif-wrap{ display:none !important; } }
  .bar-fill.danger{background:var(--red);}
  .bar-value{font-family:'JetBrains Mono',monospace;text-align:right;color:var(--ink);font-weight:500;}
  @media(max-width:640px){ .bar-row{grid-template-columns:90px 1fr 74px;font-size:11px;} }
  @media(max-width:640px){
    .grid2{grid-template-columns:1fr;}

// ---------- small utils ----------
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function nowISO(){ return new Date().toISOString(); }
function uid(){ return 'o'+Date.now()+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtFecha(f){
  if(!f) return '';
  var parts = f.split('-'); var y=parts[0], m=parts[1], d=parts[2];
  var meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d+' '+meses[parseInt(m,10)-1]+' '+y;
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

// ---------- persistence ----------
function defaultState(){
  return { schemaVersion: 5, usuarios: [], prospectos: [], oportunidades: [], metas: {} };
}
function normalizeState(raw){
  var s = raw && typeof raw === 'object' ? raw : defaultState();
  if(!Array.isArray(s.usuarios)) s.usuarios = [];
  if(!Array.isArray(s.prospectos)) s.prospectos = [];
  if(!Array.isArray(s.oportunidades)) s.oportunidades = [];
  if(!Array.isArray(s.notificaciones)) s.notificaciones = [];
  if(!s.metas || typeof s.metas !== 'object') s.metas = {};
  // migrate legacy name-only "asesores" catalog (schema v2 and earlier) into
  // pending user stubs, so existing data keeps working after this upgrade.
  if(s.usuarios.length === 0 && Array.isArray(s.asesores) && s.asesores.length){
    s.asesores.forEach(function(nombre){
      if(!nombre) return;
      s.usuarios.push({
        id: uid(), nombre: nombre, email: '', telefono: '', passwordHash: null, salt: null,
        rol: 'asesor', pendiente: true, creadoEn: nowISO()
      });
    });
  }
  delete s.asesores;
  s.usuarios.forEach(function(u){
    if(!u.id) u.id = uid();
    if(typeof u.email !== 'string') u.email = '';
    if(typeof u.telefono !== 'string') u.telefono = '';
    if(u.passwordHash === undefined) u.passwordHash = null;
    if(u.salt === undefined) u.salt = null;
    if(u.rol !== 'admin' && u.rol !== 'asesor') u.rol = 'asesor';
    if(u.pendiente === undefined) u.pendiente = !u.passwordHash;
    if(!u.creadoEn) u.creadoEn = nowISO();
  });
  s.oportunidades.forEach(function(op){
    if(!Array.isArray(op.historial)) op.historial = [];
    if(op.historial.length === 0){
      op.historial.push({etapa: op.etapa || 'agendada', fecha: op.creadoEn || nowISO(), usuario: op.asesor || ''});
    }
    if(typeof op.notas !== 'string') op.notas = op.notas || '';
    if(op.evidencia === undefined) op.evidencia = null;
    if(op.motivoPerdida === undefined) op.motivoPerdida = null;
    if(!op.telefono) op.telefono = '';
    if(!op.correo) op.correo = '';
    if(!op.tipoDocumento) op.tipoDocumento = '';
    if(!op.numeroDocumento) op.numeroDocumento = '';
    if(op.prospectoId === undefined) op.prospectoId = null;
    if(typeof op.monto !== 'number' || isNaN(op.monto)) op.monto = null;
  });
  // migrate pre-prospecto data (schema v3 and earlier): synthesize one prospecto
  // per existing oportunidad so older citas keep a linked prospect record.
  if(s.prospectos.length === 0 && s.oportunidades.length){
    s.oportunidades.forEach(function(op){
      if(op.prospectoId) return;
      var p = {
        id: uid(), asesor: op.asesor||'', clienteNombres: op.clienteNombres||'', clienteApellidos: op.clienteApellidos||'',
        telefono: op.telefono||'', correo: op.correo||'', tipoDocumento: op.tipoDocumento||'', numeroDocumento: op.numeroDocumento||'',
        producto: op.producto||'Bono Corporativo', notas:'', creadoEn: op.creadoEn || nowISO()
      };
      s.prospectos.push(p);
      op.prospectoId = p.id;
    });
  }
  s.prospectos.forEach(function(p){
    if(!p.id) p.id = uid();
    if(typeof p.asesor !== 'string') p.asesor = '';
    if(typeof p.clienteNombres !== 'string') p.clienteNombres = '';
    if(typeof p.clienteApellidos !== 'string') p.clienteApellidos = '';
    if(typeof p.telefono !== 'string') p.telefono = '';
    if(typeof p.correo !== 'string') p.correo = '';
    if(typeof p.tipoDocumento !== 'string') p.tipoDocumento = '';
    if(typeof p.numeroDocumento !== 'string') p.numeroDocumento = '';
    if(typeof p.notas !== 'string') p.notas = '';
    if(p.producto !== 'Bono Corporativo' && p.producto !== 'Fondo de Inversión') p.producto = 'Bono Corporativo';
    if(!p.creadoEn) p.creadoEn = nowISO();
  });
  s.schemaVersion = 5;
  return s;
}

function normEmail(e){ return String(e||'').trim().toLowerCase(); }
function randomHex(numBytes){
  var arr = new Uint8Array(numBytes);
  (window.crypto || window.msCrypto).getRandomValues(arr);
  return Array.from(arr).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
async function hashPassword(password, salt){
  var enc = new TextEncoder().encode(salt+':'+password);
  var buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

// ---------- Supabase sync (writes) ----------
function reportSyncError(label, error){
  if(!error) return;
  console.error('[supabase]', label, error);
  var host = document.getElementById('sync-error-host');
  if(!host){
    host = document.createElement('div');
    host.id = 'sync-error-host';
    host.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#A03A3A;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:92vw;';
    document.body.appendChild(host);
  }
  host.textContent = 'No se pudo sincronizar con el servidor (' + label + '). ' + (error.message || '');
  clearTimeout(host._t);
  host._t = setTimeout(function(){ host.remove(); }, 6000);
}
function supaInsert(table, rowOrRows){
  return supa.from(table).insert(rowOrRows).then(function(res){ if(res.error) reportSyncError('guardar', res.error); return res; });
}
function supaUpdate(table, id, row){
  return supa.from(table).update(row).eq('id', id).then(function(res){ if(res.error) reportSyncError('actualizar', res.error); return res; });
}
function supaDelete(table, id){
  return supa.from(table).delete().eq('id', id).then(function(res){ if(res.error) reportSyncError('eliminar', res.error); return res; });
}
function supaUpsertMeta(row){
  return supa.from('metas').upsert(row, {onConflict:'asesor,mes'}).then(function(res){ if(res.error) reportSyncError('guardar meta', res.error); return res; });
}

// ---------- Supabase sync (reads / realtime) ----------
async function loadAllState(){
  var results = await Promise.all([
    supa.from('usuarios').select('*'),
    supa.from('prospectos').select('*'),
    supa.from('oportunidades').select('*'),
    supa.from('metas').select('*'),
    supa.from('notificaciones').select('*')
  ]);
  var labels = ['usuarios','prospectos','oportunidades','metas','notificaciones'];
  results.forEach(function(r,i){ if(r.error) reportSyncError('cargar ' + labels[i], r.error); });
  var metas = {};
  (results[3].data || []).forEach(function(m){
    if(!metas[m.asesor]) metas[m.asesor] = {};
    metas[m.asesor][m.mes] = {citasMeta:m.citas_meta||0, cierresMeta:m.cierres_meta||0, montoMeta:Number(m.monto_meta)||0};
  });
  state = normalizeState({
    schemaVersion: 5,
    usuarios: (results[0].data || []).map(usuarioFromRow),
    prospectos: (results[1].data || []).map(prospectoFromRow),
    oportunidades: (results[2].data || []).map(oportunidadFromRow),
    metas: metas,
    notificaciones: (results[4].data || []).map(notificacionFromRow)
  });
}
async function resolveCurrentUserFromSession(){
  var res = await supa.auth.getUser();
  var authUser = res && res.data && res.data.user;
  if(!authUser){ currentUser = null; needsProfile = false; return; }
  var email = (authUser.email || '').toLowerCase();
  var u = state.usuarios.filter(function(x){ return x.email && x.email.toLowerCase() === email; })[0];
  if(u){ needsProfile = false; applyCurrentUser(u); return; }
  // Authenticated with Supabase but with no matching team profile yet. This is
  // the normal state right after someone confirms their email (if "Confirm
  // email" is on) and lands back with a session before ever calling
  // claim_or_create_usuario -- so instead of signing them out, ask them to
  // finish their profile (name/phone) and claim/create it right here.
  currentUser = null;
  needsProfile = true;
  pendingAuthEmail = authUser.email || '';
}
function upsertLocal(arr, item){
  for(var i=0;i<arr.length;i++){ if(arr[i].id === item.id){ arr[i]=item; return; } }
  arr.push(item);
}
function removeLocal(arr, id){
  for(var i=0;i<arr.length;i++){ if(arr[i].id === id){ arr.splice(i,1); return; } }
}
function wireRealtime(){
  supa.channel('bitacora-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'usuarios'}, function(payload){
      if(payload.eventType === 'DELETE') removeLocal(state.usuarios, payload.old.id);
      else upsertLocal(state.usuarios, usuarioFromRow(payload.new));
      render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'prospectos'}, function(payload){
      if(payload.eventType === 'DELETE') removeLocal(state.prospectos, payload.old.id);
      else upsertLocal(state.prospectos, prospectoFromRow(payload.new));
      render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'oportunidades'}, function(payload){
      if(payload.eventType === 'DELETE') removeLocal(state.oportunidades, payload.old.id);
      else upsertLocal(state.oportunidades, oportunidadFromRow(payload.new));
      render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'metas'}, function(payload){
      if(payload.eventType === 'DELETE'){
        if(payload.old && state.metas[payload.old.asesor]) delete state.metas[payload.old.asesor][payload.old.mes];
      } else {
        var m = payload.new;
        if(!state.metas[m.asesor]) state.metas[m.asesor] = {};
        state.metas[m.asesor][m.mes] = {citasMeta:m.citas_meta||0, cierresMeta:m.cierres_meta||0, montoMeta:Number(m.monto_meta)||0};
      }
      render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'notificaciones'}, function(payload){
      if(payload.eventType === 'DELETE') removeLocal(state.notificaciones, payload.old.id);
      else upsertLocal(state.notificaciones, notificacionFromRow(payload.new));
      render();
    })
    .subscribe();
}

function mutate(fn){
  fn(state);
  render();
}

async function initApp(){
  if(!supa){
    document.getElementById('root').innerHTML = '<div class="loading">No se pudo conectar con el servidor. Revisa tu conexión a internet y recarga la página.</div>';
    return;
  }
  await loadAllState();
  await resolveCurrentUserFromSession();
  wireRealtime();
  supa.auth.onAuthStateChange(function(event){
    if(event === 'PASSWORD_RECOVERY'){
      recoveryMode = true;
      resolveCurrentUserFromSession().then(render);
    }
  });
  render();
  startReminderClock();
}

// ---------- identity ----------
function applyCurrentUser(u){
  currentUser = { id:u.id, rol:u.rol, nombre:u.nombre, email:u.email };
  if(currentUser.rol === 'asesor'){
    prospectoForm.asesor = currentUser.nombre;
    filterAsesor = currentUser.nombre;
    kanbanAsesor = currentUser.nombre;
    reportAsesor = currentUser.nombre;
  }
}
function clearIdentity(){
  currentUser = null;
  filterAsesor = 'todos'; kanbanAsesor = 'todos'; reportAsesor = 'todos';
  view = 'agenda';
  authMode = 'login'; authError = ''; authForm = defaultAuthForm();
  supa.auth.signOut();
  render();
}
async function handleLogin(){
  authError = '';
  var email = normEmail(authForm.email);
  var pass = authForm.password;
  if(!email || !pass){ authError = 'Ingresa tu correo y contraseña.'; render(); return; }
  var res = await supa.auth.signInWithPassword({ email: email, password: pass });
  if(res.error){ authError = 'Correo o contraseña incorrectos.'; render(); return; }
  await loadAllState();
  await resolveCurrentUserFromSession();
  authForm = defaultAuthForm();
  authError = ''; authMode = 'login';
  render();
}
async function handleRegister(){
  authError = '';
  var nombre = authForm.nombre.trim();
  var email = normEmail(authForm.email);
  var telefono = authForm.telefono.trim();
  var pass = authForm.password;
  var pass2 = authForm.password2;
  if(!nombre){ authError = 'Ingresa tu nombre.'; render(); return; }
  if(!email || email.indexOf('@') === -1){ authError = 'Ingresa un correo válido.'; render(); return; }
  if(!pass || pass.length < 6){ authError = 'La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(pass !== pass2){ authError = 'Las contraseñas no coinciden.'; render(); return; }
  var signUpRes = await supa.auth.signUp({ email: email, password: pass });
  if(signUpRes.error){
    authError = (signUpRes.error.message === 'User already registered')
      ? 'Ese correo ya tiene una cuenta. Inicia sesión.'
      : (signUpRes.error.message || 'No se pudo completar el registro.');
    render(); return;
  }
  if(!signUpRes.data.session){
    authMode = 'login'; authError = '';
    authForm = defaultAuthForm();
    render();
    alert('Te enviamos un correo para confirmar tu cuenta. Confírmalo y luego inicia sesión.');
    return;
  }
  var rpcRes = await supa.rpc('claim_or_create_usuario', { p_nombre: nombre, p_telefono: telefono });
  if(rpcRes.error){ authError = 'Tu cuenta se creó pero no se pudo completar tu perfil: '+rpcRes.error.message; render(); return; }
  await loadAllState();
  applyCurrentUser(usuarioFromRow(rpcRes.data));
  authForm = defaultAuthForm();
  render();
}
async function handleChangePassword(){
  if(!passwordModal) return;
  passwordModal.error = '';
  var actual = passwordModal.actual || '';
  var nueva = passwordModal.nueva || '';
  var confirmar = passwordModal.confirmar || '';
  if(!nueva || nueva.length < 6){ passwordModal.error = 'La nueva contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(nueva !== confirmar){ passwordModal.error = 'Las contraseñas nuevas no coinciden.'; render(); return; }
  var verifyRes = await supa.auth.signInWithPassword({ email: currentUser.email, password: actual });
  if(verifyRes.error){ passwordModal.error = 'Tu contraseña actual no es correcta.'; render(); return; }
  var updateRes = await supa.auth.updateUser({ password: nueva });
  if(updateRes.error){ passwordModal.error = 'No se pudo actualizar: '+updateRes.error.message; render(); return; }
  passwordModal = null;
  alert('Tu contraseña se actualizó correctamente.');
  render();
}
async function adminResetPassword(userId){
  var u = findUsuarioById(userId);
  if(!u || !isAdmin()) return;
  if(!confirm('¿Enviar un correo a '+u.nombre+' ('+u.email+') para restablecer su contraseña?')) return;
  var redirectTo = window.location.href.split('#')[0];
  var res = await supa.auth.resetPasswordForEmail(u.email, { redirectTo: redirectTo });
  if(res.error){ alert('No se pudo enviar el correo: '+res.error.message); return; }
  alert('Se envió un correo a '+u.email+' con instrucciones para restablecer su contraseña.');
}

// ---------- funnel helpers ----------
function opsOfAsesor(asesor){ return state.oportunidades.filter(function(o){ return o.asesor===asesor; }); }
function reachedStage(op, stageKey){
  for(var i=0;i<op.historial.length;i++){ if(op.historial[i].etapa===stageKey) return true; }
  return false;
}
function emitidaDate(op){
  for(var i=op.historial.length-1;i>=0;i--){ if(op.historial[i].etapa==='emitida') return op.historial[i].fecha; }
  return null;
}
function daysInStage(op){
  if(!op.historial.length) return null;
  var last = op.historial[op.historial.length-1];
  var ms = Date.now() - new Date(last.fecha).getTime();
  return Math.max(0, Math.floor(ms/86400000));
}
function filterByMonthCreated(ops, mes){
  if(!mes) return ops;
  return ops.filter(function(o){ return (o.creadoEn||'').slice(0,7)===mes; });
}
function filterByMonthEmitida(ops, mes){
  return ops.filter(function(o){
    var d = emitidaDate(o);
    if(!d) return false;
    return !mes || d.slice(0,7)===mes;
  });
}
function countReached(ops, stageKey){
  return ops.filter(function(o){ return reachedStage(o, stageKey); }).length;
}
// ---------- month-range reporting helpers (e.g. "enero a junio") ----------
function inMonthRange(mesStr, desde, hasta){
  if(!mesStr) return false;
  if(desde && mesStr < desde) return false;
  if(hasta && mesStr > hasta) return false;
  return true;
}
function filterByMonthRangeCreated(ops, desde, hasta){
  return ops.filter(function(o){ return inMonthRange((o.creadoEn||'').slice(0,7), desde, hasta); });
}
function filterByMonthRangeEmitida(ops, desde, hasta){
  return ops.filter(function(o){
    var d = emitidaDate(o);
    if(!d) return false;
    return inMonthRange(d.slice(0,7), desde, hasta);
  });
}
function montoEnRango(ops, desde, hasta){
  return filterByMonthRangeEmitida(ops, desde, hasta).reduce(function(sum,o){ return sum + (typeof o.monto==='number' ? o.monto : 0); }, 0);
}
function mesesEnRango(desde, hasta){
  if(!desde || !hasta || hasta < desde) return [];
  var out = []; var d = desde; var guard = 0;
  while(d <= hasta && guard < 600){
    out.push(d);
    var parts = d.split('-'); var y = parseInt(parts[0],10); var m = parseInt(parts[1],10);
    m++; if(m>12){ m=1; y++; }
    d = y + '-' + String(m).padStart(2,'0');
    guard++;
  }
  return out;
}
function sumMetasRango(asesor, desde, hasta){
  var meses = mesesEnRango(desde, hasta);
  var citasMeta=0, cierresMeta=0, montoMeta=0;
  meses.forEach(function(m){
    var meta = (state.metas[asesor] && state.metas[asesor][m]) || null;
    if(meta){ citasMeta += meta.citasMeta||0; cierresMeta += meta.cierresMeta||0; montoMeta += meta.montoMeta||0; }
  });
  return {citasMeta:citasMeta, cierresMeta:cierresMeta, montoMeta:montoMeta};
}
function fmtRango(desde, hasta){
  if(!desde && !hasta) return 'todo el tiempo';
  if(desde && hasta && desde.slice(0,4)===hasta.slice(0,4) && desde.slice(5)==='01' && hasta.slice(5)==='12') return desde.slice(0,4);
  if(desde && hasta && desde===hasta) return fmtMes(desde);
  if(desde && hasta) return fmtMes(desde)+' a '+fmtMes(hasta);
  if(desde) return 'desde '+fmtMes(desde);
  return 'hasta '+fmtMes(hasta);
}
function reportFileLabel(desde, hasta){
  if(!desde && !hasta) return 'TODO EL TIEMPO';
  if(desde && hasta && desde.slice(0,4)===hasta.slice(0,4) && desde.slice(5)==='01' && hasta.slice(5)==='12') return desde.slice(0,4);
  if(desde && hasta && desde===hasta) return fmtMes(desde).toUpperCase();
  if(desde && hasta) return fmtMes(desde).toUpperCase()+' A '+fmtMes(hasta).toUpperCase();
  if(desde) return 'DESDE '+fmtMes(desde).toUpperCase();
  return 'HASTA '+fmtMes(hasta).toUpperCase();
}
function yearsForSelect(){
  var years = {};
  var now = new Date().getFullYear();
  years[now]=true; years[now-1]=true; years[now+1]=true;
  state.oportunidades.forEach(function(o){
    if(o.creadoEn) years[parseInt(o.creadoEn.slice(0,4),10)] = true;
    (o.historial||[]).forEach(function(h){ if(h.fecha) years[parseInt(h.fecha.slice(0,4),10)] = true; });
  });
  return Object.keys(years).map(Number).sort(function(a,b){ return b-a; });
}
function fmtUSD(n){
  if(n==null || isNaN(n)) return '—';
  return '$ ' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
}

// ---------- reminders ----------
function citaDateTime(c){ return new Date(c.fecha+'T'+(c.hora||'00:00')+':00'); }
function getUpcomingReminders(){
  if(!currentUser) return [];
  var now = new Date();
  var limite = new Date(now.getTime() + 24*60*60*1000);
  return state.oportunidades
    .filter(function(c){ return c.fecha && c.hora && c.etapa!=='emitida' && c.etapa!=='perdida'; })
    .filter(function(c){ return currentUser.rol === 'admin' || c.asesor === currentUser.nombre; })
    .map(function(c){ var copy = Object.assign({}, c); copy._dt = citaDateTime(c); return copy; })
    .filter(function(c){ return c._dt >= now && c._dt <= limite; })
    .sort(function(a,b){ return a._dt - b._dt; })
    .slice(0,6);
}
function minutesLabel(dt){
  var diffMs = dt.getTime() - Date.now();
  var mins = Math.round(diffMs/60000);
  if(mins < 60) return 'en '+mins+' min';
  var hrs = Math.floor(mins/60);
  var isToday = dt.toDateString() === new Date().toDateString();
  if(isToday) return 'hoy · en '+hrs+' h';
  return 'mañana · '+dt.toTimeString().slice(0,5);
}
function startReminderClock(){
  if(reminderTimer) clearInterval(reminderTimer);
  reminderTimer = setInterval(checkBrowserNotifications, 60000);
  checkBrowserNotifications();
}
function checkBrowserNotifications(){
  if(!notifsEnabled || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  var now = new Date();
  getUpcomingReminders().forEach(function(c){
    var diffMin = (c._dt.getTime() - now.getTime())/60000;
    if(diffMin <= 15 && diffMin >= 0 && !notifiedIds[c.id]){
      notifiedIds[c.id] = true;
      try{
        new Notification('Cita próxima: '+c.clienteNombres+' '+c.clienteApellidos, {
          body: c.hora+' · '+(c.modalidad === 'Virtual' ? 'Virtual' : c.lugar)+' · '+c.asesor
        });
      }catch(e){}
    }
  });
}
async function toggleNotifs(){
  if(typeof Notification === 'undefined'){ alert('Este navegador no soporta notificaciones.'); return; }
  if(!notifsEnabled){
    var perm = await Notification.requestPermission();
    if(perm === 'granted'){ notifsEnabled = true; checkBrowserNotifications(); }
    else { alert('No se concedió el permiso de notificaciones.'); }
  } else { notifsEnabled = false; }
  render();
}
function renderReminders(){
  var list = getUpcomingReminders();
  var toggleBtn = '<button class="btn '+(notifsEnabled?'primary':'')+'" id="notif-toggle">'+
    (notifsEnabled ? 'Avisos del navegador: activados' : 'Activar avisos del navegador')+'</button>';
  if(list.length === 0){
    return '<div class="reminders"><div class="rem-empty">Sin reuniones próximas en las siguientes 24 horas.</div>'+toggleBtn+'</div>';
  }
  var items = list.map(function(c){
    var mins = (c._dt.getTime()-Date.now())/60000;
    var urgClass = mins <= 60 ? 'rem-urgent' : (mins <= 240 ? 'rem-soon' : '');

      '<span class="rem-adv">'+escapeHtml(c.asesor)+'</span></div>';
  }).join('');
  return '<div class="reminders"><h2>Recordatorios · próximas 24 h</h2>'+items+toggleBtn+'</div>';
}

// ---------- CSV helpers ----------
function parseCSV(text){
  var rows = []; var row = []; var field=''; var inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes=false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length===1 && r[0].trim()===''); });
}
function csvEscape(v){
  var s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function toCSV(headers, rows){
  var lines = [headers.map(csvEscape).join(',')];
  rows.forEach(function(r){ lines.push(r.map(csvEscape).join(',')); });
  return lines.join('\r\n');
}
function normHeader(h){
  return String(h||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
}
async function downloadTextFile(filename, content){
  try{
    var blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }catch(e){
    copyModal = {filename: filename, content: content};
    render();
  }
}

// ---------- image resize (evidence photos) ----------
function resizeImage(file, maxWidth, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxWidth/img.width);
        var w = Math.round(img.width*scale);
        var h = Math.round(img.height*scale);
        var canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// shared handlers used by both Agenda and Funnel views
function parseMontoInput(raw){
  if(raw === null || raw === undefined) return null;
  var cleaned = String(raw).trim().replace(/[^0-9.,-]/g, '').replace(/,/g, '');
  if(!cleaned) return null;
  var n = parseFloat(cleaned);
  if(isNaN(n) || n < 0) return null;
  return Math.round(n * 100) / 100;
}
function onEtapaChange(id, newVal){
  var op = state.oportunidades.filter(function(o){ return o.id===id; })[0];
  if(!op || !canEditOportunidad(op)) return;
  if(newVal === 'perdida'){
    var motivo = window.prompt('Motivo de la pérdida (opcional):', op.motivoPerdida||'');
    if(motivo === null){ render(); return; }
    mutate(function(){
      op.motivoPerdida = motivo.trim();
      op.etapa = 'perdida';
      op.actualizadoEn = nowISO();
      op.historial.push({etapa:'perdida', fecha: nowISO(), usuario: currentUser.nombre});
    });
    supaUpdate('oportunidades', op.id, oportunidadToRow(op));
    return;
  }
  if(newVal === 'emitida'){
    var raw = window.prompt('Monto emitido en USD:', op.monto!=null ? String(op.monto) : '');
    if(raw === null){ render(); return; }
    var monto = parseMontoInput(raw);
    mutate(function(){
      op.monto = monto!=null ? monto : (op.monto!=null ? op.monto : 0);
      op.motivoPerdida = null;
      op.etapa = 'emitida';
      op.actualizadoEn = nowISO();
      op.historial.push({etapa:'emitida', fecha: nowISO(), usuario: currentUser.nombre});
    });
    supaUpdate('oportunidades', op.id, oportunidadToRow(op));
    return;
  }
  mutate(function(){
    op.motivoPerdida = null;
    op.etapa = newVal;
    op.actualizadoEn = nowISO();
    op.historial.push({etapa:newVal, fecha: nowISO(), usuario: currentUser.nombre});
  });
  supaUpdate('oportunidades', op.id, oportunidadToRow(op));
}

function deleteOp(id){

function attachEvidence(id){
  var op = state.oportunidades.filter(function(o){ return o.id===id; })[0];
  if(!op || !canEditOportunidad(op)) return;
  var input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.capture='environment';
  input.onchange = async function(){
    if(!input.files || !input.files[0]) return;
    try{
      var dataUrl = await resizeImage(input.files[0], 700, 0.65);
      mutate(function(){ op.evidencia = dataUrl; op.actualizadoEn = nowISO(); });
      supaUpdate('oportunidades', op.id, oportunidadToRow(op));
    }catch(e){}
  };
  input.click();

// ---------- funnel drag-and-drop (mouse/touch card movement between columns) ----------
function wireDragAndDrop(){
  document.querySelectorAll('[data-drag-op]').forEach(function(card){
    card.addEventListener('dragstart', function(e){
      try{ e.dataTransfer.setData('text/plain', card.dataset.dragOp); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
  });
  document.querySelectorAll('[data-drop-col]').forEach(function(col){
    col.addEventListener('dragover', function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', function(e){
      if(e.target === col) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', function(e){
      e.preventDefault();
      col.classList.remove('drag-over');
      var id = e.dataTransfer.getData('text/plain');
      var newStage = col.dataset.dropCol;
      if(!id || !newStage) return;
      var op = state.oportunidades.filter(function(o){ return o.id===id; })[0];
      if(!op || op.etapa === newStage) return;
      onEtapaChange(id, newStage);
    });
  });
}

function diasEnRangoMeses(desde, hasta){
  var meses = mesesEnRango(desde, hasta);
  if(!meses.length) return 0;
  var total = 0;
  meses.forEach(function(m){
    var parts = m.split('-'); var y = parseInt(parts[0],10), mo = parseInt(parts[1],10);
    total += new Date(y, mo, 0).getDate();
  });
  return total;
}
function filterByMonthRangeFecha(ops, desde, hasta){
  return ops.filter(function(o){ return o.fecha && inMonthRange(o.fecha.slice(0,7), desde, hasta); });
}
function horaPromedioRows(ops, desde, hasta){
  var cohort = filterByMonthRangeFecha(ops, desde, hasta).filter(function(o){ return o.hora; });
  var porHora = {}; for(var h=0; h<24; h++) porHora[h] = 0;
  var diasConDatos = {};
  cohort.forEach(function(o){
    var hh = parseInt((o.hora||'').split(':')[0], 10);
    if(isNaN(hh) || hh<0 || hh>23) return;
    porHora[hh] += 1;
    diasConDatos[o.fecha] = true;
  });
  var totalDias = (desde && hasta) ? diasEnRangoMeses(desde, hasta) : Object.keys(diasConDatos).length;
  totalDias = Math.max(1, totalDias);
  var rows = [];
  for(var i=0;i<24;i++){
    if(porHora[i] === 0) continue;
    rows.push({label:String(i).padStart(2,'0')+':00', n: Math.round((porHora[i]/totalDias)*100)/100});
  }
  return rows;
}
function renderHoraPromedioCard(asesor, admin, desde, hasta){
  var ops = (admin && asesor==='todos') ? state.oportunidades : opsOfAsesor(asesor);
  var rows = horaPromedioRows(ops, desde, hasta);
  return '<div class="report-card">'+
    '<h2>Promedio de reuniones por hora</h2>'+

function renderKpiRow(stats){

function renderMontoBars(rows, opts){
  opts = opts || {};
  if(!rows.length) return '<div class="sub">Sin datos para este periodo.</div>';
  var max = Math.max.apply(null, rows.map(function(r){ return r.monto||0; }).concat([0]));
  var list = opts.noSort ? rows : rows.slice().sort(function(a,b){ return (b.monto||0)-(a.monto||0); });
  return '<div class="bars">'+list.map(function(r){
    var pct = max>0 ? Math.max(2, Math.round((r.monto||0)/max*100)) : 0;
    return '<div class="bar-row">'+
      '<div class="bar-label">'+escapeHtml(r.a)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-value">'+fmtUSD(r.monto)+'</div>'+
    '</div>';
  }).join('')+'</div>';
}
function renderCountBars(rows, opts){
  opts = opts || {};
  if(!rows.length) return '<div class="sub">Sin datos para este periodo.</div>';
  var max = Math.max.apply(null, rows.map(function(r){ return r.n||0; }).concat([0]));
  var list = opts.noSort ? rows : rows.slice().sort(function(a,b){ return (b.n||0)-(a.n||0); });
  return '<div class="bars">'+list.map(function(r){
    var pct = max>0 ? Math.max(2, Math.round((r.n||0)/max*100)) : 0;
    return '<div class="bar-row">'+
      '<div class="bar-label">'+escapeHtml(r.label)+'</div>'+
      '<div class="bar-track"><div class="bar-fill'+(r.danger?' danger':'')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-value">'+r.n+'</div>'+

function funnelRows(creadas, stageCounts, perdidas){
  return [{label:'Creadas', n:creadas}]
    .concat(stageCounts.map(function(sc){ return {label:sc.label, n:sc.n}; }))
    .concat([{label:'Perdidas', n:perdidas, danger: perdidas>0}]);

function topMotivosPerdida(ops, limit){

  });
  supaUpsertMeta({asesor:asesor, mes:mes, citas_meta:citasMeta, cierres_meta:cierresMeta, monto_meta:montoMeta||0});

    return [a, creadas, presentadas, gestion, acres, emitidas, perdidas, conversion, monto.toFixed(2), meta.citasMeta, avanceCitas, meta.cierresMeta, avanceCierres, meta.montoMeta, avanceMonto];
  });
  var suffix = (desde||hasta) ? ((desde||'inicio')+'_a_'+(hasta||'hoy')) : 'todo';
  downloadTextFile('reporte_comparativo_'+suffix+'.csv', toCSV(headers, rows));
}

function reasignarProspecto(id, nuevoAsesor){
  var p = findProspectoById(id);
  if(!p || !isAdmin()) return;
  nuevoAsesor = (nuevoAsesor||'').trim();
  if(!nuevoAsesor || nuevoAsesor === p.asesor) return;
  var citas = citasDeProspecto(id);
  mutate(function(){
    p.asesor = nuevoAsesor;
    citas.forEach(function(c){ c.asesor = nuevoAsesor; });
  });
  supaUpdate('prospectos', p.id, prospectoToRow(p));
  citas.forEach(function(c){ supaUpdate('oportunidades', c.id, oportunidadToRow(c)); });
  if(nuevoAsesor !== currentUser.nombre){
    crearNotificacion(nuevoAsesor, 'prospecto_asignado', 'Se te asignó un prospecto: '+p.clienteNombres+' '+p.clienteApellidos, p.id);
  }
  render();
}
function aplicarReasignacionMasiva(nuevoAsesor){
  var ids = Object.keys(prospectoSeleccionados).filter(function(id){ return prospectoSeleccionados[id]; });
  if(!ids.length){ alert('Selecciona al menos un prospecto para reasignar.'); return; }
  ids.forEach(function(id){ reasignarProspecto(id, nuevoAsesor); });
  prospectoSeleccionados = {};
  render();
}
function eliminarProspectosSeleccionados(){
  if(!isAdmin()) return;
  var ids = Object.keys(prospectoSeleccionados).filter(function(id){ return prospectoSeleccionados[id]; });
  if(!ids.length){ alert('Selecciona al menos un prospecto para eliminar.'); return; }
  var citasTotal = 0;
  ids.forEach(function(id){ citasTotal += citasDeProspecto(id).length; });
  var msg = '¿Eliminar '+ids.length+' prospecto(s) seleccionado(s)?'+
    (citasTotal ? ' Tienen '+citasTotal+' cita(s) registradas en total; esas citas no se eliminan, pero quedarán sin prospecto vinculado.' : '');
  if(!confirm(msg)) return;
  mutate(function(s){ s.prospectos = s.prospectos.filter(function(p){ return ids.indexOf(p.id) === -1; }); });
  ids.forEach(function(id){ supaDelete('prospectos', id); });
  prospectoSeleccionados = {};
  render();
}

function applyProspectoSearchFilter(){
  var q = normHeader(prospectoSearch);
  var visible = 0, total = 0;
  document.querySelectorAll('[data-prospecto-row]').forEach(function(tr){
    total++;
    var match = !q || (tr.dataset.search||'').indexOf(q) !== -1;
    tr.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  var countEl = document.getElementById('prospecto-count');
  if(countEl) countEl.textContent = q ? (visible+' de '+total) : String(total);
  var noResults = document.getElementById('prospecto-no-results');
  if(noResults) noResults.style.display = (total>0 && visible===0) ? '' : 'none';
}

var LEAD_ALIASES = {
  asesor:['asesor'], clienteNombres:['nombres','nombre'], clienteApellidos:['apellidos','apellido'],
  telefono:['telefono','celular','whatsapp'], correo:['correo','email','correo electronico'],
  tipoDocumento:['tipo de documento','tipodocumento','tipo doc'],
  numeroDocumento:['numero de documento','nº de documento','n de documento','dni','numerodocumento','documento'],
  producto:['producto','producto de interes'],
  fecha:['fecha'], hora:['hora'], modalidad:['modalidad'], lugar:['lugar','direccion'],
  meetLink:['enlace','enlace de reunion','meet','link'], notas:['notas','nota','observaciones']
};
var ASESOR_ALIASES = {
  nombre:['nombre','asesor'], correo:['correo','email','correo electronico'],
  telefono:['telefono','celular','whatsapp']
};
function buildAliasHeaderMap(headerRow, aliases){
  var map = {};
  headerRow.forEach(function(h, idx){
    var n = normHeader(h);
    Object.keys(aliases).forEach(function(field){
      if(aliases[field].indexOf(n) !== -1 && map[field]===undefined) map[field] = idx;
    });
  });
  return map;
}
function buildHeaderMap(headerRow){ return buildAliasHeaderMap(headerRow, LEAD_ALIASES); }
function parseLeadsCSV(text){
  var rows = parseCSV(text);
  if(rows.length===0) return [];
  var map = buildHeaderMap(rows[0]);
  var hasAsesorCol = map.asesor !== undefined;
  var dataRows = hasAsesorCol ? rows.slice(1) : rows;
  return dataRows.map(function(r){
    function get(field){ var idx = map[field]; return idx===undefined ? '' : (r[idx]||'').trim(); }
    var asesor = hasAsesorCol ? get('asesor') : (r[0]||'').trim();
    var nombres = hasAsesorCol ? get('clienteNombres') : (r[1]||'').trim();
    var apellidos = hasAsesorCol ? get('clienteApellidos') : (r[2]||'').trim();
    var telefono = hasAsesorCol ? get('telefono') : (r[3]||'').trim();
    var correo = hasAsesorCol ? get('correo') : (r[4]||'').trim();
    var tipoDocumento = hasAsesorCol ? get('tipoDocumento') : (r[5]||'').trim();
    var numeroDocumento = hasAsesorCol ? get('numeroDocumento') : (r[6]||'').trim();
    var productoRaw = normHeader(hasAsesorCol ? get('producto') : (r[7]||''));
    var producto = productoRaw.indexOf('fondo') !== -1 ? 'Fondo de Inversión' : 'Bono Corporativo';
    var modalidadRaw = normHeader(hasAsesorCol ? get('modalidad') : (r[10]||''));
    var modalidad = modalidadRaw.indexOf('virtual') !== -1 ? 'Virtual' : 'Presencial';
    var item = {
      asesor: asesor, clienteNombres: nombres, clienteApellidos: apellidos,
      telefono: telefono, correo: correo,
      tipoDocumento: numeroDocumento ? (tipoDocumento || 'DNI') : '',
      numeroDocumento: numeroDocumento,
      producto: producto,
      fecha: hasAsesorCol ? get('fecha') : (r[8]||'').trim(),
      hora: hasAsesorCol ? get('hora') : (r[9]||'').trim(),
      modalidad: modalidad,
      lugar: modalidad==='Presencial' ? (hasAsesorCol ? get('lugar') : (r[11]||'').trim()) : '',
      meetLink: modalidad==='Virtual' ? (hasAsesorCol ? get('meetLink') : (r[12]||'').trim()) : '',
      notas: hasAsesorCol ? get('notas') : (r[13]||'').trim()
    };
    if(!item.asesor || !item.clienteNombres || !item.clienteApellidos || !item.telefono){
      item.error = 'Faltan datos obligatorios (asesor, nombres, apellidos o teléfono)';
    }
    return item;
  });
}
function parseAsesoresCSV(text){
  var rows = parseCSV(text);
  if(rows.length===0) return [];
  var map = buildAliasHeaderMap(rows[0], ASESOR_ALIASES);
  var hasHeader = map.nombre !== undefined || map.correo !== undefined;
  var dataRows = hasHeader ? rows.slice(1) : rows;
  var seen = {};
  var out = [];
  dataRows.forEach(function(r){
    var nombre = hasHeader ? (map.nombre!==undefined ? (r[map.nombre]||'').trim() : '') : (r[0]||'').trim();
    var correo = hasHeader ? (map.correo!==undefined ? (r[map.correo]||'').trim() : '') : (r[1]||'').trim();
    var telefono = hasHeader ? (map.telefono!==undefined ? (r[map.telefono]||'').trim() : '') : (r[2]||'').trim();
    if(!nombre && !correo && !telefono) return;
    var item = { nombre: nombre, correo: correo, telefono: telefono };
    var key = normEmail(correo);
    if(!nombre || !correo){
      item.error = 'Faltan datos obligatorios (nombre o correo)';
    } else if(seen[key]){
      item.error = 'Correo repetido en el archivo';
    } else if(findUsuarioByEmail(correo)){
      item.error = 'Ese correo ya existe en el equipo';
    }
    if(key) seen[key] = true;
    out.push(item);
  });
  return out;
}

      '<div class="modal">'+
        '<h3>'+escapeHtml(c.clienteNombres)+' '+escapeHtml(c.clienteApellidos)+'</h3>'+
        '<div style="font-size:12.5px;color:var(--ink-soft);">'+(c.fecha?fmtFecha(c.fecha)+' · ':'')+(c.hora?escapeHtml(c.hora)+' · ':'')+escapeHtml(c.asesor)+'</div>'+
        (c.evidencia ? '<img src="'+c.evidencia+'" alt="Evidencia de la reunión">' : '<div style="padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;">Sin evidencia</div>')+
        '<div style="display:flex;justify-content:flex-end;margin-top:12px;"><button class="btn" id="modal-close">Cerrar</button></div>'+
      '</div>'+
    '</div>';
  document.getElementById('modal-bg').onclick = function(e){ if(e.target.id==='modal-bg'){ evidenceModal=null; render(); } };
  document.getElementById('modal-close').onclick = function(){ evidenceModal=null; render(); };
}
function renderCopyModal(){
  var host = document.getElementById('modal-host') || (function(){ var d=document.createElement('div'); d.id='modal-host'; document.body.appendChild(d); return d; })();
  var c = copyModal;
  host.innerHTML =
    '<div class="modal-bg" id="copy-modal-bg">'+
      '<div class="modal">'+
        '<h3>'+escapeHtml(c.filename)+'</h3>'+
        '<div style="font-size:12px;color:var(--ink-soft);">La descarga automática no está disponible aquí. Copia el contenido y guárdalo como archivo .csv.</div>'+
        '<textarea id="copy-text" readonly>'+escapeHtml(c.content)+'</textarea>'+
        '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">'+
          '<button class="btn" id="copy-close">Cerrar</button>'+
          '<button class="btn primary" id="copy-copy">Copiar al portapapeles</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.getElementById('copy-modal-bg').onclick = function(e){ if(e.target.id==='copy-modal-bg'){ copyModal=null; render(); } };
  document.getElementById('copy-close').onclick = function(){ copyModal=null; render(); };
  document.getElementById('copy-copy').onclick = async function(){
    try{ await navigator.clipboard.writeText(c.content); }
    catch(e){ document.getElementById('copy-text').select(); document.execCommand && document.execCommand('copy'); }
  };
}

initApp();
})();
</script>

</body>
</html>
